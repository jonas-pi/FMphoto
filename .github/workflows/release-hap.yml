name: Release HAP

on:
  # 仅在推送版本标签时触发，避免每次提交都执行发布流程
  push:
    tags:
      - "v*"
  # 允许手动触发，便于补发历史版本资产
  workflow_dispatch:
    inputs:
      tag:
        description: '要补发的版本标签，例如 v1.4.2.12'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-hap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 需要完整历史与全部标签：用于算出「上一个版本」和 Full Changelog 对比链接。
          # 默认的浅克隆只带触发 ref，git tag 看不到其它标签，链接会退回到 v1.0.10。
          fetch-depth: 0
          # 手动补发时按输入的标签取树；推标签时取触发 ref
          ref: ${{ inputs.tag || github.ref }}

      - name: Ensure HAP exists
        shell: bash
        run: |
          # 这里校验目标文件存在，失败时给出明确错误，避免发布空资产
          HAP_PATH="entry/build/default/outputs/default/entry-default-unsigned.hap"
          if [ ! -f "$HAP_PATH" ]; then
            echo "Missing build artifact: $HAP_PATH"
            echo "Please commit the file first, or build it on CI before release."
            exit 1
          fi

      - name: Extract changelog from CHANGELOG.md
        id: changelog
        shell: bash
        env:
          # 手动补发时用输入的标签，推标签时用触发标签。
          # 显式经 env 传入最稳妥：workflow_dispatch 的输入不会自动变成 INPUT_* 环境变量。
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"
          VER="${TAG#v}"
          BODY="$(bash scripts/extract-changelog-section.sh "$VER")"
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "No changelog section for [$VER] in CHANGELOG.md"
            exit 1
          fi
          COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/v1.0.10...${TAG}"
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo ""
            echo "**Full Changelog**: ${COMPARE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload HAP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 仅上传未签名包；签名包与密钥严禁上传
          # 手动补发时发布到输入的标签，推标签时发布到触发标签
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            entry/build/default/outputs/default/entry-default-unsigned.hap
          fail_on_unmatched_files: true
          generate_release_notes: false
          overwrite_files: true
          # 标签名含 beta / rc 时标记为预发布
          prerelease: ${{ contains(inputs.tag || github.ref_name, 'beta') || contains(inputs.tag || github.ref_name, 'rc') }}
