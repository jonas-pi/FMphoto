name: Release HAP

on:
  # 仅在推送版本标签时触发，避免每次提交都执行发布流程
  push:
    tags:
      - "v*"
  # 允许手动触发，便于补发历史版本资产
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-hap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure HAP exists
        shell: bash
        run: |
          # 这里校验目标文件存在，失败时给出明确错误，避免发布空资产
          HAP_PATH="entry/build/default/outputs/default/entry-default-unsigned.hap"
          if [ ! -f "$HAP_PATH" ]; then
            echo "Missing build artifact: $HAP_PATH"
            echo "Please commit the file first, or build it on CI before release."
            exit 1
          fi

      - name: Extract changelog from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          BODY="$(bash scripts/extract-changelog-section.sh "$VER")"
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "No changelog section for [$VER] in CHANGELOG.md"
            exit 1
          fi
          COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/v1.0.10...${TAG}"
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo ""
            echo "**Full Changelog**: ${COMPARE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload HAP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 如标签已存在 release，则自动更新并重新上传资产（开启覆盖）
          body: ${{ steps.changelog.outputs.body }}
          files: |
            entry/build/release/outputs/default/entry-default-signed.hap
            entry/build/release/outputs/default/entry-default-unsigned.hap
            entry/build/default/outputs/default/entry-default-unsigned.hap
          fail_on_unmatched_files: true
          generate_release_notes: false
          overwrite_files: true
